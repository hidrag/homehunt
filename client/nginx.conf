# S16 (ADR-042) — production reverse proxy + static host for the SPA.
#
# Two rules matter more than the rest:
#  1. sw.js / index.html / manifest.webmanifest are served NO-CACHE — a cached
#     service worker or shell pins a stale app across deploys (S15/ADR-039).
#  2. Hashed /assets/* are immutable — safe because Vite content-hashes them.
# CSP enumerates every external origin the app actually uses; a generic
# "default-src 'self'" would silently break tiles, uploads, tours and Leaflet.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for text assets (images/fonts already compressed).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Security headers (applied to every response) -----------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: self + inline styles (Leaflet injects inline styles) + data: images
    # (Leaflet markers) + OSM tiles + seed/upload image hosts + tour frames.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://images.unsplash.com https://res.cloudinary.com; connect-src 'self' https://*.tile.openstreetmap.org; font-src 'self' data:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://my.matterport.com https://kuula.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # --- Cache-control split (ADR-042) --------------------------------------
    # Never cache the service worker, the shell or the manifest.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    # Content-hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- API reverse proxy --------------------------------------------------
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- WebSocket proxy (Socket.io) ---------------------------------------
    location /socket.io/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # --- SPA fallback -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
