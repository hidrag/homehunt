# S16 (ADR-041) — isolated E2E environment. Same topology as the production
# simulation, but with raised rate limits so a 6-journey Playwright run is not
# throttled, and a disposable volume. NEVER use this profile for production.
services:
  mongodb:
    image: mongo:7
    volumes:
      - mongo-e2e-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  server:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:4173
      MONGODB_URI: mongodb://mongodb:27017/homehunt-e2e
      JWT_ACCESS_SECRET: e2e-access-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: e2e-refresh-secret-minimum-32-characters-long
      TRUST_PROXY: "1"
      # Raised so the full journey suite is never throttled (ADR-042 knobs).
      RATE_LIMIT_MAX: "100000"
      RATE_LIMIT_WINDOW_MS: "60000"
      UPLOAD_PROVIDER: fake
      EMAIL_PROVIDER: fake
    depends_on:
      mongodb:
        condition: service_healthy
    expose:
      - "5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    depends_on:
      server:
        condition: service_started
    ports:
      - "4173:80"

volumes:
  mongo-e2e-data:
